<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrderBuds — Operator</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --panel-2: #1e242c; --line: #2a323c;
    --text: #e8edf3; --muted: #93a1b1; --accent: #25d366; --danger: #ef4d4d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font-weight: 700; letter-spacing: -.02em; }
  .brand span { color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; }
  .hidden { display: none !important; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
  input, button { font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 10px 12px; }
  input { flex: 1; min-width: 0; }
  button { background: var(--accent); color: #06301a; font-weight: 600; border: none;
    cursor: pointer; padding: 10px 16px; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; align-items: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .pill { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.trialing  { background: #4a3a12; color: #ffd479; }
  .pill.active    { background: #123a24; color: #7ff0a8; }
  .pill.suspended { background: #4a1616; color: #ff9c9c; }
  .pill.cancelled { background: #2a323c; color: #93a1b1; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); font-size: 13px; min-height: 18px; }
  .hint { background: #1e242c; border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand">Order<span>Buds</span> · Operator</div>
  <div class="row">
    <button id="refresh" class="ghost hidden">Refresh</button>
    <button id="signout" class="ghost hidden">Sign out</button>
  </div>
</header>

<main>
  <section id="gate" class="card" style="max-width:460px;margin:48px auto;">
    <h2 style="margin:0 0 6px;font-size:18px;">Operator access</h2>
    <p class="muted" style="margin:0 0 16px;">
      Cross-tenant view. Paste the operator secret (the <code>ADMIN_SECRET</code> /
      <code>CRON_SECRET</code> value). It is kept in this tab only.
    </p>
    <form id="gate-form" class="row">
      <input id="secret" type="password" placeholder="Operator secret" required autocomplete="off">
      <button type="submit">Open</button>
    </form>
    <div class="error" id="gate-error" style="margin-top:10px;"></div>
  </section>

  <section id="panel" class="hidden">
    <div class="grid" style="margin-bottom:16px;">
      <div class="card stat"><div class="label">Total shops</div><div class="value" id="t-total">—</div></div>
      <div class="card stat"><div class="label">Trialing</div><div class="value" id="t-trial">—</div></div>
      <div class="card stat"><div class="label">Active</div><div class="value" id="t-active">—</div></div>
      <div class="card stat"><div class="label">Suspended</div><div class="value" id="t-susp">—</div></div>
      <div class="card stat"><div class="label">Orders</div><div class="value" id="t-orders">—</div></div>
      <div class="card stat"><div class="label">GMV</div><div class="value" id="t-gmv">—</div></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 12px;font-size:17px;">Shops</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th>Shop</th><th>Owner</th><th>Status</th><th>Trial ends</th>
            <th>Days left</th><th>Orders</th><th>Disconnected</th>
          </tr></thead>
          <tbody id="tenants-body">
            <tr><td colspan="7" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let secret = sessionStorage.getItem('ob_admin_secret') || '';

async function load() {
  if (!secret) { showGate(); return; }
  const headers = { Authorization: `Bearer ${secret}` };
  try {
    const [statsRes, tenantsRes] = await Promise.all([
      fetch('/api/admin?view=stats', { headers }),
      fetch('/api/admin?view=tenants', { headers }),
    ]);
    if (statsRes.status === 401 || tenantsRes.status === 401) {
      sessionStorage.removeItem('ob_admin_secret');
      secret = '';
      $('gate-error').textContent = 'Secret rejected.';
      showGate();
      return;
    }
    const stats = await statsRes.json();
    const { tenants } = await tenantsRes.json();
    renderStats(stats);
    renderTenants(tenants);
    $('gate').classList.add('hidden');
    $('panel').classList.remove('hidden');
    $('refresh').classList.remove('hidden');
    $('signout').classList.remove('hidden');
  } catch (err) {
    $('gate-error').textContent = err.message;
  }
}

function showGate() {
  $('gate').classList.remove('hidden');
  $('panel').classList.add('hidden');
  $('refresh').classList.add('hidden');
  $('signout').classList.add('hidden');
}

function renderStats(s) {
  $('t-total').textContent = s.tenants.total;
  $('t-trial').textContent = s.tenants.trialing;
  $('t-active').textContent = s.tenants.active;
  $('t-susp').textContent = s.tenants.suspended;
  $('t-orders').textContent = s.orders.orders;
  $('t-gmv').textContent = new Intl.NumberFormat(undefined, {
    style: 'currency', currency: 'USD',
  }).format((s.orders.revenue_cents || 0) / 100);
}

function renderTenants(tenants) {
  const body = $('tenants-body');
  if (!tenants.length) {
    body.innerHTML = '<tr><td colspan="7" class="muted">No shops yet.</td></tr>';
    return;
  }
  body.innerHTML = tenants.map((t) => `<tr>
    <td><strong>${esc(t.business_name)}</strong><br><span class="muted">${esc(t.slug)}</span></td>
    <td class="muted">${esc(t.owner_email)}</td>
    <td><span class="pill ${t.status}">${t.status}</span></td>
    <td class="muted">${t.status === 'trialing' ? new Date(t.trial_ends_at).toLocaleString() : '—'}</td>
    <td>${t.status === 'trialing' ? t.daysLeft : '—'}</td>
    <td>${t.order_count}</td>
    <td class="muted">${t.disconnected_at ? new Date(t.disconnected_at).toLocaleString() : '—'}</td>
  </tr>`).join('');
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

$('gate-form').onsubmit = (e) => {
  e.preventDefault();
  secret = $('secret').value.trim();
  sessionStorage.setItem('ob_admin_secret', secret);
  $('gate-error').textContent = '';
  load();
};

$('signout').onclick = () => {
  sessionStorage.removeItem('ob_admin_secret');
  secret = '';
  $('secret').value = '';
  showGate();
};

$('refresh').onclick = load;
load();
</script>
</body>
</html>
